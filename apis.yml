aid: ent
name: Ent
description: 'Ent is an intent-aware security platform for the enterprise that protects
  work as it happens. The company reads human, AI agent, and application activity in
  real time to understand intent and act at the moment of risk, rather than relying
  on after-the-fact logs and static policies. Ent is an early-stage security company
  backed by Felicis and surfaced in the API Evangelist network as a portfolio lead;
  this profile captures its public web, legal, and security-disclosure surface. No
  public API, developer portal, SDKs, or OpenAPI have been published to date, so API
  and specification artifacts are not yet applicable.'
